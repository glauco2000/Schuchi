<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sushi do Osmar - Cardápio Digital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #d90429;
            --secondary: #2b2d42;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #212529;
            --accent: #ffb703;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 80px;
        }

        header {
            background-color: var(--secondary);
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        header p {
            font-size: 0.9rem;
            color: #adb5bd;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .card-desc {
            font-size: 0.85rem;
            color: #6c757d;
            margin-bottom: 12px;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .price {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary);
        }

        .btn-add {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-add:hover {
            background-color: #b7031f;
        }

        /* Carrinho Flutuante */
        .cart-float {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--primary);
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            z-index: 100;
        }

        /* Modal de Checkout */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 500px;
            padding: 20px;
            border-radius: 10px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 10px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 0.95rem;
        }

        .cart-items-list {
            margin-bottom: 15px;
            max-height: 150px;
            overflow-y: auto;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 10px;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .btn-checkout {
            background-color: #28a745;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-checkout:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <header>
        <h1>🍣 Sushi do Osmar</h1>
        <p>O melhor sushi da região direto na sua casa</p>
    </header>

    <div class="container">
        <div class="menu-grid" id="menu-grid">
            <!-- Os produtos serão injetados via JavaScript -->
        </div>
    </div>

    <!-- Botão Flutuante do Carrinho -->
    <div class="cart-float" onclick="abrirCheckout()">
        <i class="fa-solid fa-cart-shopping"></i>
        <span>Ver Carrinho (<span id="cart-count">0</span>)</span>
    </div>

    <!-- Modal do Carrinho / Checkout -->
    <div class="modal" id="checkout-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Finalizar Pedido</h3>
                <button class="close-btn" onclick="fecharCheckout()">&times;</button>
            </div>
            
            <div class="cart-items-list" id="cart-items-container">
                <!-- Itens adicionados aparecem aqui -->
            </div>

            <div style="text-align: right; font-weight: bold; margin-bottom: 15px; font-size: 1.1rem;">
                Total: <span id="cart-total" style="color: var(--primary);">R$ 0,00</span>
            </div>

            <form id="order-form" onsubmit="enviarPedido(event)">
                <div class="form-group">
                    <label for="nome">Seu Nome:</label>
                    <input type="text" id="nome" required placeholder="Ex: João da Silva">
                </div>
                <div class="form-group">
                    <label for="telefone">Telefone / WhatsApp:</label>
                    <input type="text" id="telefone" required placeholder="Ex: (48) 99999-9999">
                </div>
                <div class="form-group">
                    <label for="endereco">Endereço de Entrega:</label>
                    <textarea id="endereco" rows="2" required placeholder="Rua, Número, Bairro, Complemento"></textarea>
                </div>
                <div class="form-group">
                    <label for="pagamento">Forma de Pagamento:</label>
                    <select id="pagamento" required>
                        <option value="Dinheiro">Dinheiro</option>
                        <option value="Cartão na Entrega">Cartão na Entrega</option>
                        <option value="Pix (Entrega/Manual)">Pix</option>
                        <option value="Mercado Pago (Online)">Mercado Pago (Online)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="observacoes">Observações (Opcional):</label>
                    <textarea id="observacoes" rows="2" placeholder="Ex: Sem cebolinha, caprichar no gengibre..."></textarea>
                </div>

                <button type="submit" class="btn-checkout" id="btn-enviar">Confirmar Pedido</button>
            </form>
        </div>
    </div>

    <script>
        // SUBSTITUA ABAIXO PELA SUA URL DE WEB APP DO GOOGLE APPS SCRIPT
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzr0uAQcuwf1kGUwmUquBPx74wlAvR5ywwjQ5HCxIHweapwCHdOGFe1hlWv0qmT5d80sA/exec";

        const produtos = [
            { id: 1, nome: "Combinado Simples (15 peças)", desc: "Hossomaki, Uramaki e Niguiri variado.", preco: 45.00, img: "img/combinado-simples.jpg" },
            { id: 2, nome: "Combinado Executivo (30 peças)", desc: "Seleção especial do sushiman com sashimi.", preco: 89.90, img: "img/combinado-executivo.jpg" },
            { id: 3, nome: "Hot Roll Philadelphia (10 unid)", desc: "Enrolado empanado e frito recheado com salmão e cream cheese.", preco: 32.00, img: "img/hot-roll.jpg" },
            { id: 4, nome: "Uramaki Salmão (8 unid)", desc: "Arroz por fora, gergelim, salmão fresco e cream cheese.", preco: 28.00, img: "img/uramaki.jpg" },
            { id: 5, nome: "Temaki Salmão Completo", desc: "Cone de alga recheado com arroz, salmão cubos e cream cheese.", preco: 24.90, img: "img/temaki.jpg" }
        ];

        let carrinho = [];

        function renderizarMenu() {
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = "";
            produtos.forEach(prod => {
                grid.innerHTML += `
                    <div class="card">
                        <img src="${prod.img}" alt="${prod.nome}" onerror="this.src='https://via.placeholder.com/280x180?text=Sushi'">
                        <div class="card-content">
                            <div class="card-title">${prod.nome}</div>
                            <div class="card-desc">${prod.desc}</div>
                            <div class="card-footer">
                                <span class="price">R$ ${prod.preco.toFixed(2).replace('.', ',')}</span>
                                <button class="btn-add" onclick="adicionarAoCarrinho(${prod.id})">Adicionar</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function adicionarAoCarrinho(id) {
            const produto = produtos.find(p => p.id === id);
            const itemExistente = carrinho.find(i => i.id === id);
            
            if (itemExistente) {
                itemExistente.qtd++;
            } else {
                carrinho.push({ ...produto, qtd: 1 });
            }
            atualizarUI();
        }

        function atualizarUI() {
            const totalItens = carrinho.reduce((sum, item) => sum + item.qtd, 0);
            document.getElementById('cart-count').innerText = totalItens;
            
            const container = document.getElementById('cart-items-container');
            container.innerHTML = "";
            
            if (carrinho.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:#6c757d;'>Seu carrinho está vazio.</p>";
            } else {
                carrinho.forEach(item => {
                    container.innerHTML += `
                        <div class="cart-item-row">
                            <span>${item.qtd}x ${item.nome}</span>
                            <span>R$ ${(item.preco * item.qtd).toFixed(2).replace('.', ',')}</span>
                        </div>
                    `;
                });
            }

            const total = carrinho.reduce((sum, item) => sum + (item.preco * item.qtd), 0);
            document.getElementById('cart-total').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }

        function abrirCheckout() {
            if (carrinho.length === 0) {
                alert("Adicione pelo menos um item ao carrinho antes de prosseguir.");
                return;
            }
            document.getElementById('checkout-modal').style.display = 'flex';
        }

        function fecharCheckout() {
            document.getElementById('checkout-modal').style.display = 'none';
        }

        async function enviarPedido(event) {
            event.preventDefault();
            
            const btn = document.getElementById('btn-enviar');
            btn.innerText = "Processando...";
            btn.disabled = true;

            const nome = document.getElementById('nome').value;
            const telefone = document.getElementById('telefone').value;
            const endereco = document.getElementById('endereco').value;
            const pagamento = document.getElementById('pagamento').value;
            const observacoes = document.getElementById('observacoes').value;

            const total = carrinho.reduce((sum, item) => sum + (item.preco * item.qtd), 0);
            const totalFormatado = `R$ ${total.toFixed(2).replace('.', ',')}`;
            const numeroPedido = "#" + Math.floor(1000 + Math.random() * 9000);

            let itensTexto = "";
            carrinho.forEach(item => {
                itensTexto += `- ${item.qtd}x ${item.nome} (R$ ${(item.preco * item.qtd).toFixed(2).replace('.', ',')})\n`;
            });

            const dadosPedido = {
                acao: "enviar_notificacao",
                pedido: numeroPedido,
                nome: nome,
                telefone: telefone,
                endereco: endereco,
                pagamento: pagamento,
                observacoes: observacoes,
                totalFormatado: totalFormatado,
                itens: itensTexto,
                itensArray: carrinho
            };

            // Se for Mercado Pago Online, geramos a preferência de pagamento primeiro
            if (pagamento === "Mercado Pago (Online)") {
                try {
                    const response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            acao: "gerar_pagamento",
                            itensArray: carrinho
                        })
                    });
                    const resJson = await response.json();
                    if (resJson.url) {
                        window.location.href = resJson.url;
                        return;
                    }
                } catch (e) {
                    console.error("Erro ao gerar link do Mercado Pago:", e);
                }
            }

            // Envio padrão para entrega (gravação na planilha + e-mail + WhatsApp)
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(dadosPedido)
                });
            } catch (e) {
                console.log("Erro de requisição, prosseguindo com WhatsApp.");
            }

            carrinho = [];
            atualizarUI();
            fecharCheckout();

            btn.innerText = "Confirmar Pedido";
            btn.disabled = false;

            let msg = `🍣 *NOVO PEDIDO ${numeroPedido}*\n\n*Cliente:* ${nome}\n*Endereço:* ${endereco}\n*Pagamento:* ${pagamento}\n*Total:* ${totalFormatado}`;
            if (observacoes.trim() !== "") {
                msg += `\n*Obs:* ${observacoes}`;
            }
            msg += `\n\n*Itens:*\n${itensTexto}`;

            const urlWhatsApp = `https://wa.me/5548984696949?text=${encodeURIComponent(msg)}`;

            if (confirm("✅ Pedido gravado e e-mail enviado com sucesso!\n\nClique em 'OK' para abrir o WhatsApp e enviar os detalhes para a nossa cozinha.")) {
                window.location.href = urlWhatsApp;
            }
        }

        // Inicializar cardápio ao carregar
        window.onload = renderizarMenu;
    </script>
</body>
</html>
