<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sushi do Osmar - Delivery</title>
    <style>
        :root { --primary: #d90429; --dark: #121212; --light: #f4f4f5; --green: #2b9348; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: var(--light); padding-bottom: 90px; }
        header { background: var(--dark); color: white; padding: 25px 20px; text-align: center; border-bottom: 4px solid var(--primary); }
        header h1 { margin: 0; font-size: 2.3rem; }
        
        .status-loja { padding: 10px; font-weight: bold; text-align: center; font-size: 0.95rem; }
        .aberto { background-color: #2b9348; color: white; }
        .fechado { background-color: #d90429; color: white; }

        .container { max-width: 900px; margin: 25px auto; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        
        .produto { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
        .produto img { width: 100%; height: 200px; object-fit: cover; }
        .produto-info { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .produto-info h3 { margin: 0 0 10px 0; color: var(--dark); }
        .produto-info p { margin: 0 0 15px 0; color: #666; font-size: 0.9rem; flex-grow: 1; }
        .preco-add { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .preco { font-weight: bold; color: var(--green); font-size: 1.3rem; }
        button { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #b20322; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        
        #cart-float { position: fixed; bottom: 25px; right: 25px; background: var(--green); color: white; padding: 15px 25px; border-radius: 50px; display: none; align-items: center; gap: 15px; cursor: pointer; box-shadow: 0 5px 20px rgba(43,147,72,0.4); z-index: 100; font-size: 1.1rem; }
        
        #checkout-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 15px; width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto; }
        .modal-content h2 { margin-top: 0; color: var(--dark); border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #444; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        #btn-enviar { width: 100%; padding: 15px; font-size: 1.1rem; margin-top: 15px; background: var(--green); }
    </style>
</head>
<body>

    <header>
        <h1>Sushi do Osmar</h1>
        <p style="margin: 5px 0 0 0;">Tradição e Qualidade na sua casa</p>
    </header>

    <div id="status-loja" class="status-loja fechado">Verificando horário...</div>

    <div class="container" id="menu"></div>

    <div id="cart-float" onclick="abrirCheckout()">
        <span>🛒</span>
        <div style="font-weight: bold;"><span id="cart-count">0</span> itens | <span id="cart-total">R$ 0,00</span></div>
    </div>

    <div id="checkout-modal">
        <div class="modal-content">
            <h2>Finalizar Pedido</h2>
            <div id="resumo-carrinho" style="margin-bottom: 20px;"></div>
            
            <form id="form-pedido" onsubmit="finalizarPedido(event)">
                <div class="form-group">
                    <label>Nome completo</label>
                    <input type="text" id="nome" autocomplete="name" required>
                </div>
                <div class="form-group">
                    <label>Telefone (WhatsApp)</label>
                    <input type="tel" id="telefone" autocomplete="tel" placeholder="(48) 99999-9999" maxlength="15" required>
                </div>
                <div class="form-group">
                    <label>Endereço de Entrega</label>
                    <input type="text" id="endereco" autocomplete="street-address" required placeholder="Rua, Número, Bairro">
                </div>
                <div class="form-group">
                    <label>Observações do Pedido (Opcional)</label>
                    <input type="text" id="observacoes" placeholder="Ex: Sem cebola, sem gergelim, troco para 50...">
                </div>
                <div class="form-group">
                    <label>Forma de Pagamento</label>
                    <select id="pagamento" required>
                        <option value="" disabled selected>Selecione...</option>
                        <option value="Pix (Mercado Pago)">Pix / Cartão (Mercado Pago)</option>
                        <option value="PIX ou Dinheiro na Entrega">PIX ou Dinheiro na Entrega</option>
                    </select>
                </div>
                
                <div style="display: flex; gap: 10px;">
                    <button type="button" onclick="fecharCheckout()" style="background: #ccc; color: #333; flex: 1;">Voltar</button>
                    <button type="submit" id="btn-enviar" style="flex: 2;">Confirmar Pedido</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // COLOQUE SUA NOVA URL AQUI
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz5MeHks12X30cwSR3seTFoAAf63VF0czP45xLtVHY-NGU5OE-C2HDQj61fE6oKhc9_/exec"; 
        
        const produtos = [
            { id: 1, nome: 'Barca Especial', preco: 149.90, desc: 'A melhor seleção do chef.', img: 'img/barca-especial.jpg' },
            { id: 2, nome: 'Combinado Executivo', preco: 65.00, desc: 'Perfeito para o almoço.', img: 'img/combinado-executiv.jpg' },
            { id: 3, nome: 'Porção de Gyosa', preco: 28.00, desc: 'Pastéis orientais recheados.', img: 'img/gyosa.jpg' },
            { id: 4, nome: 'Hossomaki', preco: 22.00, desc: 'Rolinhos tradicionais finos.', img: 'img/hossomaki.jpg' },
            { id: 5, nome: 'Joy de Salmão', preco: 35.00, desc: 'O queridinho da casa.', img: 'img/joy-salmao.jpg' },
            { id: 6, nome: 'Hot Philadelphia', preco: 29.90, desc: 'Empanado e crocante.', img: 'img/philadelphia.jpg' },
            { id: 7, nome: 'Sashimi de Salmão', preco: 45.00, desc: 'Fatias frescas de salmão.', img: 'img/sashimi-salmao.jpg' },
            { id: 8, nome: 'Sunomono', preco: 18.00, desc: 'Salada refrescante de pepino.', img: 'img/sunomono.jpg' },
            { id: 9, nome: 'Temaki de Salmão', preco: 32.00, desc: 'Cone de alga com salmão.', img: 'img/temaki-salmao.jpg' },
            { id: 10, nome: 'Uramaki Skin', preco: 1.00, desc: 'Pele de salmão grelhada.', img: 'img/uramaki-skin.jpg' }
        ];

        let carrinho = [];

        function carregarProdutos() {
            const menu = document.getElementById('menu');
            produtos.forEach(p => {
                menu.innerHTML += `
                    <div class="produto">
                        <img src="${p.img}" onerror="this.src='${p.img.replace('.jpg', '.png')}'" alt="${p.nome}">
                        <div class="produto-info">
                            <h3>${p.nome}</h3>
                            <p>${p.desc}</p>
                            <div class="preco-add">
                                <span class="preco">R$ ${p.preco.toFixed(2).replace('.', ',')}</span>
                                <button class="btn-add-prod" onclick="addCarrinho(${p.id}, '${p.nome}', ${p.preco})">Adicionar</button>
                            </div>
                        </div>
                    </div>`;
            });
        }

        function obterUrlAbsoluta(caminhoRelativo) {
            let baseUrl = window.location.href.split('?')[0];
            if (!baseUrl.endsWith('/')) {
                baseUrl = baseUrl.substring(0, baseUrl.lastIndexOf('/') + 1);
            }
            return baseUrl + caminhoRelativo;
        }

        function addCarrinho(id, nome, preco) {
            const item = carrinho.find(i => i.id === id);
            if (item) item.qtd++; else carrinho.push({ id, nome, preco, qtd: 1 });
            atualizarUI();
        }

        function atualizarUI() {
            const totalItens = carrinho.reduce((acc, i) => acc + i.qtd, 0);
            const totalValor = carrinho.reduce((acc, i) => acc + (i.preco * i.qtd), 0);
            document.getElementById('cart-count').innerText = totalItens;
            document.getElementById('cart-total').innerText = `R$ ${totalValor.toFixed(2).replace('.', ',')}`;
            document.getElementById('cart-float').style.display = totalItens > 0 ? 'flex' : 'none';
        }

        function abrirCheckout() {
            document.getElementById('checkout-modal').style.display = 'flex';
            const resumo = document.getElementById('resumo-carrinho');
            let html = "";
            let total = 0;
            
            carrinho.forEach(i => {
                const sub = i.preco * i.qtd;
                total += sub;
                const original = produtos.find(p => p.id === i.id);
                const imgPath = original ? original.img : '';
                
                html += `<div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid #f0f0f0; padding-bottom: 8px;">
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <img src="${imgPath}" width="40" height="40" style="object-fit: cover; border-radius: 6px;" onerror="this.style.display='none'">
                                <span><strong>${i.qtd}x</strong> ${i.nome}</span>
                            </div>
                            <span style="font-weight: 600;">R$ ${sub.toFixed(2).replace('.',',')}</span>
                       </div>`;
            });
            resumo.innerHTML = html + `<div style="margin-top: 10px; text-align: right;"><strong style="font-size:1.1rem; color:var(--green)">Total: R$ ${total.toFixed(2).replace('.',',')}</strong></div>`;
        }

        function fecharCheckout() { document.getElementById('checkout-modal').style.display = 'none'; }

        const inputTelefone = document.getElementById('telefone');
        inputTelefone.addEventListener('input', function(e) {
            let valor = e.target.value.replace(/\D/g, '');
            if (valor.length > 11) valor = valor.slice(0, 11);
            if (valor.length > 6) valor = `(${valor.slice(0, 2)}) ${valor.slice(2, 7)}-${valor.slice(7)}`;
            else if (valor.length > 2) valor = `(${valor.slice(0, 2)}) ${valor.slice(2)}`;
            else if (valor.length > 0) valor = `(${valor}`;
            e.target.value = valor;
        });

        async function finalizarPedido(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-enviar');
            btn.innerText = "Processando..."; 
            btn.disabled = true;

            const pedidoId = '#' + Math.floor(Math.random() * 90000 + 10000);
            const totalNumerico = carrinho.reduce((acc, i) => acc + (i.preco * i.qtd), 0); 
            const itensTexto = carrinho.map(i => `${i.qtd}x ${i.nome} - R$ ${(i.preco * i.qtd).toFixed(2)}`).join('\n');
            
            const itensCompletos = carrinho.map(itemProd => {
                const original = produtos.find(p => p.id === itemProd.id);
                return {
                    nome: itemProd.nome,
                    preco: itemProd.preco,
                    qtd: itemProd.qtd,
                    img: original ? obterUrlAbsoluta(original.img) : ''
                };
            });

            const dadosPedido = {
                pedido: pedidoId,
                nome: document.getElementById('nome').value,
                telefone: document.getElementById('telefone').value,
                endereco: document.getElementById('endereco').value,
                pagamento: document.getElementById('pagamento').value,
                observacoes: document.getElementById('observacoes').value, // Pegando o novo campo
                itens: itensTexto,
                itensArray: itensCompletos,
                total: totalNumerico, 
                totalFormatado: `R$ ${totalNumerico.toFixed(2).replace('.', ',')}`
            };

            if (dadosPedido.pagamento.includes('Mercado Pago')) {
                dadosPedido.acao = "gerar_pagamento";
                localStorage.setItem('sakura_pedido_mp', JSON.stringify(dadosPedido));
                
                try {
                    const req = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify(dadosPedido)
                    });
                    const res = await req.json();
                    
                    if(res.status === "sucesso") {
                        window.location.href = res.url; 
                    } else {
                        alert("Erro ao conectar com Mercado Pago. Tente novamente.");
                        btn.innerText = "Confirmar Pedido"; btn.disabled = false;
                    }
                } catch(erro) {
                    alert("Erro de conexão. Verifique sua internet ou tente outra forma de pagamento.");
                    btn.innerText = "Confirmar Pedido"; btn.disabled = false;
                }
            } else {
                dadosPedido.acao = "enviar_notificacao";
                dispararFinal(dadosPedido);
            }
        }

        async function dispararFinal(dadosPedido) {
            const btn = document.getElementById('btn-enviar');
            btn.innerText = "Registrando pedido..."; // Informa o usuário sem travar a tela
            try {
                // Aguarda o script registrar na planilha e mandar o email
                await fetch(GOOGLE_SCRIPT_URL, { 
                    method: 'POST', 
                    body: JSON.stringify(dadosPedido) 
                });
                
                btn.innerText = "Redirecionando..."; 
                
                let msg = `🍣 *NOVO PEDIDO ${dadosPedido.pedido}*\n\n*Cliente:* ${dadosPedido.nome}\n*Pagamento:* ${dadosPedido.pagamento}\n*Total:* ${dadosPedido.totalFormatado}`;
                
                // Adiciona as observações na mensagem do WhatsApp se o cliente digitou algo
                if (dadosPedido.observacoes && dadosPedido.observacoes.trim() !== "") {
                    msg += `\n*Obs:* ${dadosPedido.observacoes}`;
                }
                
                // Usa assign() sem o alert() para evitar bloqueio do navegador de celular
                const urlWhatsApp = `https://wa.me/5548984696949?text=${encodeURIComponent(msg)}`;
                window.location.assign(urlWhatsApp);
                
            } catch(e) {
                alert("Houve um erro ao enviar seu pedido. Tente novamente.");
                btn.innerText = "Confirmar Pedido"; 
                btn.disabled = false;
            }
        }

        function verificarRetornoMP() {
            const urlParams = new URLSearchParams(window.location.search);
            const status = urlParams.get('status');
            
            if (status === 'approved') {
                const pendente = JSON.parse(localStorage.getItem('sakura_pedido_mp'));
                if (pendente) {
                    pendente.acao = "enviar_notificacao";
                    pendente.pagamento = "Mercado Pago (Aprovado)";
                    dispararFinal(pendente);
                    localStorage.removeItem('sakura_pedido_mp');
                    window.history.replaceState(null, null, window.location.pathname);
                }
            }
        }

        function verificarHorario() {
            const agora = new Date();
            const hora = agora.getHours();
            const statusDiv = document.getElementById('status-loja');
            const botoes = document.querySelectorAll('.btn-add-prod');
            
            const aberto = (hora >= 19 && hora < 23);
            
            if (aberto) {
                statusDiv.className = "status-loja aberto";
                statusDiv.innerText = "🟢 Loja Aberta! Faça o seu pedido (Atendimento até às 23:00)";
                botoes.forEach(b => b.disabled = false);
            } else {
                statusDiv.className = "status-loja fechado";
                statusDiv.innerText = "🔴 Loja Fechada no momento. Horário de atendimento: das 19:00 às 23:00";
                botoes.forEach(b => b.disabled = true);
            }
        }

        carregarProdutos();
        verificarHorario();
        setInterval(verificarHorario, 60000);
        window.onload = verificarRetornoMP;
    </script>
</body>
</html>
